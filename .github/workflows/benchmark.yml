name: Checkpoint soak benchmark

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Soak duration in seconds (snapshot held for the first half)
        type: choice
        options:
          - '7200'
          - '1200'
          - '240'
        default: '7200'
      profile:
        description: Collect diagnostic CPU stacks and worker activity; adds measurement overhead
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: checkpoint-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOAK_SECONDS: ${{ inputs.duration }}
      PROFILE_SOAK: ${{ inputs.profile }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source and runner
        run: |
          mkdir -p benchmarks/results/actions
          {
            git rev-parse HEAD
            uname -a
            lscpu
            free -h
            df -h
            rustup show
            printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
            printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Soak seconds: %s\n' "$SOAK_SECONDS"
            printf 'Diagnostic profiling: %s\n' "$PROFILE_SOAK"
          } 2>&1 | tee benchmarks/results/actions/environment.txt
      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev libreadline-dev zlib1g-dev libssl-dev libclang-dev clang bison flex
      - name: Install Linux profiler
        if: inputs.profile
        run: |
          sudo apt-get install -y linux-tools-generic
          roots=()
          for root in /usr/lib/linux-tools*; do
            if [[ -d "$root" ]]; then roots+=("$root"); fi
          done
          [[ ${#roots[@]} -gt 0 ]] || { echo 'No Linux tools directories installed' >&2; exit 1; }
          perf_bin="$(rg --files --follow --hidden --no-ignore "${roots[@]}" -g perf | sort -Vu | tail -n 1)"
          [[ -x "$perf_bin" ]] || { echo 'No perf executable installed' >&2; exit 1; }
          printf 'PERF_BIN=%s\n' "$perf_bin" >> "$GITHUB_ENV"
          "$perf_bin" version | tee benchmarks/results/actions/perf-version.txt
      - name: Check profiling capability before building PostgreSQL
        if: inputs.profile
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_profile_soak.py'
          python3 benchmarks/scripts/profile_soak.py probe --perf-bin "$PERF_BIN" --sudo \
            --output benchmarks/results/actions/profile-probe
      - name: Build project-local PostgreSQL and pgrx
        timeout-minutes: 90
        run: bash scripts/setup.sh 2>&1 | tee benchmarks/results/actions/setup.log
      - name: Run production checkpoint soak
        timeout-minutes: 185
        run: |
          vmstat -t 60 > benchmarks/results/actions/load.log &
          monitor_pid=$!
          profiler_pid=''
          cleanup() {
            kill "$monitor_pid" 2>/dev/null || true
            if [[ -n "$profiler_pid" ]] && kill -0 "$profiler_pid" 2>/dev/null; then
              kill -TERM "$profiler_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          if [[ "$PROFILE_SOAK" == true ]]; then
            python3 benchmarks/scripts/profile_soak.py collect --perf-bin "$PERF_BIN" --sudo \
              --pg-bin "$PWD/.tools/postgresql-production/18.6/install/bin" \
              --soak-seconds "$SOAK_SECONDS" --output benchmarks/results/actions/profiles \
              > benchmarks/results/actions/profile-collection.log 2>&1 &
            profiler_pid=$!
          fi
          set +e
          timeout --signal=TERM --kill-after=60s 180m \
            bash scripts/checkpoint-soak.sh \
              --checkpoint-soak-seconds "$SOAK_SECONDS" \
              --checkpoint-column-type int4 \
              --recovery-checks true \
              --output benchmarks/results/actions/checkpoint-soak.json \
            2>&1 | tee benchmarks/results/actions/checkpoint-soak.log
          pipeline_rc=("${PIPESTATUS[@]}")
          set -e
          profile_rc=0
          if [[ -n "$profiler_pid" ]]; then
            if kill -0 "$profiler_pid" 2>/dev/null; then
              kill -TERM "$profiler_pid" 2>/dev/null || true
            fi
            set +e
            wait "$profiler_pid"
            profile_rc=$?
            set -e
          fi
          if (( pipeline_rc[0] != 0 )); then exit "${pipeline_rc[0]}"; fi
          if (( pipeline_rc[1] != 0 )); then exit "${pipeline_rc[1]}"; fi
          exit "$profile_rc"
      - name: Render available CPU profiles after the timed workload
        if: always() && inputs.profile
        timeout-minutes: 10
        run: |
          pg_bin="$PWD/.tools/postgresql-production/18.6/install/bin"
          if [[ -x "$pg_bin/pg_config" ]]; then
            mkdir -p benchmarks/results/actions/profile-binaries
            cp "$pg_bin/postgres" benchmarks/results/actions/profile-binaries/
            cp "$("$pg_bin/pg_config" --pkglibdir)/syntradb.so" benchmarks/results/actions/profile-binaries/
          fi
          if [[ -f benchmarks/results/actions/profiles/collection.json ]]; then
            python3 benchmarks/scripts/profile_soak.py analyze --perf-bin "$PERF_BIN" \
              --output benchmarks/results/actions/profiles
          fi
      - name: Verify completed soak report
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('benchmarks/results/actions/checkpoint-soak.json').read_text())
          stress = report['checkpoint_stress']
          if stress['duration_seconds'] != int(os.environ['SOAK_SECONDS']) or stress['soak'] is None:
              raise SystemExit('The report does not contain the requested completed soak')
          if stress['unexpected_errors'] != 0 or stress['invariant_failures'] != 0:
              raise SystemExit('The completed soak reported correctness failures')
          if stress['soak']['failures'] or stress['quiescent_keyed_check'] is not True or stress['quiescent_checkpoint_reuse'] is not True:
              raise SystemExit('The completed soak did not pass every final correctness/service gate')
          PY
      - name: Save benchmark logs and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/results/actions/
          if-no-files-found: warn
          retention-days: 7
