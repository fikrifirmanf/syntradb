name: Rust and PostgreSQL
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*.md'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev libreadline-dev zlib1g-dev libssl-dev libclang-dev clang bison flex
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build project-local PostgreSQL and pgrx
        run: |
          mkdir -p benchmarks/results/ci
          bash scripts/setup.sh 2>&1 | tee benchmarks/results/ci/setup.log
      - name: Check Rust and PostgreSQL integration
        run: bash scripts/check.sh 2>&1 | tee benchmarks/results/ci/check.log
      - name: Build and verify a pilot installation bundle
        timeout-minutes: 20
        run: |
          bash scripts/setup-production.sh 2>&1 | tee benchmarks/results/ci/production-setup.log
          python3 scripts/package-pilot.py \
            --pg-config "$PWD/.tools/postgresql-production/18.6/install/bin/pg_config" \
            --output "$PWD/benchmarks/results/pilot-package" \
            2>&1 | tee benchmarks/results/ci/package.log
      - name: Verify fresh-scan concurrency and decimal grouping
        timeout-minutes: 10
        run: |
          bash scripts/benchmark-production.sh --mixed-seconds 0 --rows 100 \
            --repetitions 3 --recovery-checks false \
            --output benchmarks/results/ci/fresh-scan-smoke.json \
            2>&1 | tee benchmarks/results/ci/fresh-scan-smoke.log
      - name: Save pilot bundle and installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/results/pilot-package/syntradb-*-pilot.tar.gz
            benchmarks/results/pilot-package/SHA256SUMS
            benchmarks/results/pilot-package/bundle/manifest.json
            benchmarks/results/pilot-package/bundle/verification.json
            benchmarks/results/pilot-package/build.log
            benchmarks/results/pilot-package/verification/*.log
            benchmarks/results/pilot-package/verification/*.stdout
            benchmarks/results/pilot-package/verification/*.stderr
            benchmarks/results/pilot-package/archive-verification/*.log
            benchmarks/results/pilot-package/archive-verification/*.stdout
            benchmarks/results/pilot-package/archive-verification/*.stderr
          if-no-files-found: warn
          retention-days: 7
      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/results/ci/
          if-no-files-found: warn
          retention-days: 7
