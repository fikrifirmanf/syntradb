name: Recovery and lifecycle verification

on:
  workflow_dispatch:
    inputs:
      check:
        description: Check name, or all
        type: string
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: readiness-${{ github.ref }}-${{ inputs.check }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.select.outputs.checks }}
    steps:
      - id: select
        env:
          SELECTED_CHECK: ${{ inputs.check }}
        run: |
          python3 - <<'PY'
          import json
          import os

          checks = [
              'recovery', 'maintenance',
              'restore-int2', 'restore-int4', 'restore-int8', 'restore-numeric',
              'replica-int2', 'replica-int4', 'replica-int8', 'replica-numeric',
              'topology-int4', 'topology-numeric',
              'quorum-int4', 'quorum-numeric',
              'upgrade-0.1.0', 'upgrade-0.2.0', 'upgrade-0.3.0',
              'upgrade-0.4.0', 'upgrade-0.5.0', 'upgrade-0.6.0',
              'upgrade-0.7.0', 'upgrade-load-0.7.0',
              'upgrade-0.8.0', 'upgrade-load-0.8.0',
              'upgrade-0.9.0', 'upgrade-load-0.9.0',
              'downgrade-0.7.0', 'downgrade-0.8.0',
              'downgrade-0.9.0', 'downgrade-0.10.0',
          ]
          selected = os.environ['SELECTED_CHECK']
          if selected != 'all':
              if selected not in checks:
                  raise SystemExit(f'Unknown verification check: {selected}')
              checks = [selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('checks=' + json.dumps(checks) + '\n')
          PY
  verify:
    needs: plan
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    env:
      CHECK: ${{ matrix.check }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record verification environment
        run: |
          mkdir -p benchmarks/results/readiness
          {
            git rev-parse HEAD
            uname -a
            lscpu
            free -h
            df -h
            rustup show
            printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
            printf 'Check: %s\n' "$CHECK"
          } 2>&1 | tee benchmarks/results/readiness/environment.txt
      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev libreadline-dev zlib1g-dev libssl-dev libclang-dev clang bison flex bc
      - name: Build project-local PostgreSQL and pgrx
        timeout-minutes: 90
        run: bash scripts/setup.sh 2>&1 | tee benchmarks/results/readiness/setup.log
      - name: Verify recovery or lifecycle behavior
        timeout-minutes: 50
        run: |
          case "$CHECK" in
            recovery) command=(bash scripts/recovery-checks.sh --output benchmarks/results/readiness/recovery.json) ;;
            maintenance) command=(bash scripts/maintenance-check.sh) ;;
            restore-*) command=(bash scripts/physical-restore-check.sh "${CHECK#restore-}" 4 2) ;;
            replica-*) command=(bash scripts/replica-check.sh "${CHECK#replica-}") ;;
            topology-*) command=(bash scripts/replica-topology-check.sh "${CHECK#topology-}") ;;
            quorum-*) command=(bash scripts/quorum-check.sh "${CHECK#quorum-}") ;;
            upgrade-load-0.7.0) command=(bash scripts/upgrade-load-check.sh 0.7.0 30 100) ;;
            upgrade-load-0.9.0) command=(bash scripts/upgrade-load-check.sh 0.9.0 30 100) ;;
            upgrade-load-0.8.0) command=(bash scripts/upgrade-load-check.sh 0.8.0 30 100) ;;
            upgrade-*) command=(bash scripts/upgrade-check.sh "${CHECK#upgrade-}") ;;
            downgrade-0.7.0) command=(bash scripts/downgrade-0.7.0-check.sh) ;;
            downgrade-0.8.0) command=(bash scripts/downgrade-0.8.0-check.sh) ;;
            downgrade-0.10.0) command=(bash scripts/downgrade-0.10.0-check.sh) ;;
            downgrade-0.9.0) command=(bash scripts/downgrade-0.9.0-check.sh) ;;
            *) echo "Unknown verification check: $CHECK" >&2; exit 2 ;;
          esac
          timeout --signal=TERM --kill-after=60s 45m "${command[@]}" \
            2>&1 | tee benchmarks/results/readiness/check.log
      - name: Collect server diagnostics
        if: always()
        run: |
          if [[ -d target ]]; then
            find target -type f \( -name '*.log' -o -name '*.diff' -o -name '*.catalog' \) \
              -size -10M -exec cp --parents '{}' benchmarks/results/readiness/ \;
          fi
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/results/readiness/
          if-no-files-found: warn
          retention-days: 7
