[package]
name = "syntra-storage-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
crc32fast = "=1.5.3"
syntra-storage = { path = "../crates/syntra-storage" }
syntra-exec = { path = "../crates/syntra-exec" }

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grouping"
path = "fuzz_targets/grouping.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
